name: Release PonWrt

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        type: string
      package:
        description: Extra Kconfig package selections, one per line
        required: false
        type: string
      config_only:
        description: Only generate and upload .config files
        required: true
        default: false
        type: boolean
      prerelease:
        description: Mark as prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    environment: release
    strategy:
      fail-fast: false
      matrix:
        target:
          - an7581

    steps:
      - uses: actions/checkout@v6

      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: ponwrt-dl-${{ matrix.target }}-${{ hashFiles('feeds.conf.default', 'configs/*.config', 'custom/**/*.config') }}
          restore-keys: |
            ponwrt-dl-${{ matrix.target }}-

      - name: Cache build tools
        id: build-cache
        if: ${{ inputs.config_only != true }}
        uses: actions/cache@v4
        with:
          path: |
            .ccache
            staging_dir/host*
            staging_dir/tool*
          key: ponwrt-build-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('feeds.conf.default', 'configs/*.config', 'custom/**/*.config', 'include/**/*.mk', 'toolchain/**/Makefile', 'toolchain/**/*.version', 'tools/**/Makefile') }}
          restore-keys: |
            ponwrt-build-${{ runner.os }}-${{ matrix.target }}-

      - name: Refresh build cache stamps
        if: ${{ inputs.config_only != true && steps.build-cache.outputs.cache-hit == 'true' }}
        run: |
          if [ -d staging_dir ]; then
            find staging_dir -type d -name stamp -not -path "*target*" |
              while IFS= read -r dir; do
                find "$dir" -type f -exec touch {} +
              done
            mkdir -p tmp
            echo 1 > tmp/.build
          fi

      - name: Install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply custom package sources and patches
        run: |
          custom/scripts/packages.sh
          custom/scripts/handles.sh

      - name: Load repository signing key
        env:
          PONWRT_APK_PRIVATE_KEY: ${{ secrets.PONWRT_APK_PRIVATE_KEY }}
        run: |
          if [ -n "$PONWRT_APK_PRIVATE_KEY" ]; then
            umask 077
            printf '%s\n' "$PONWRT_APK_PRIVATE_KEY" > private-key.pem
            openssl ec -in private-key.pem -pubout -out public-key.pem
          fi

      - name: Configure ${{ matrix.target }}
        env:
          CUSTOM_PACKAGE_SELECTIONS: ${{ inputs.package }}
        run: |
          ./scripts/kconfig.pl + + \
            "configs/${{ matrix.target }}.config" \
            configs/release.config \
            custom/config/general.config > .config
          custom/scripts/settings.sh .config
          make defconfig

      - name: Download sources
        if: ${{ inputs.config_only != true }}
        run: make download -j"$(nproc)"

      - name: Build ${{ matrix.target }}
        if: ${{ inputs.config_only != true }}
        run: make -j"$(nproc)"

      - name: Stage release files for ${{ matrix.target }}
        env:
          CONFIG_ONLY: ${{ inputs.config_only }}
        run: |
          mkdir release
          cp .config "release/ponwrt-${{ matrix.target }}.config"
          if [ "$CONFIG_ONLY" != "true" ]; then
            target_dir="bin/targets/airoha/${{ matrix.target }}"
            find "$target_dir" -maxdepth 1 -type f -print0 |
              while IFS= read -r -d '' file; do
                base="$(basename "$file")"
                cp "$file" "release/ponwrt-${{ matrix.target }}-$base"
              done
          fi

      - name: Upload ${{ matrix.target }}
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download firmware archives
        uses: actions/download-artifact@v4
        with:
          pattern: ponwrt-*
          path: release
          merge-multiple: true

      - name: Create checksums
        working-directory: release
        run: sha256sum * > sha256sums

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          args=(
            "$RELEASE_TAG"
            release/*
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "PonWrt $RELEASE_TAG"
            --generate-notes
          )
          if [ "$PRERELEASE" = true ]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
